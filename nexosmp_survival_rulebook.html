        let currentPage = 0;
        const totalPages = pages.length;

        function renderBook() {
            const spreadContainer = document.getElementById('book-spread');
            const pageData = pages[currentPage];
            
            // Add page transition classes
            spreadContainer.classList.add('page-content', 'page-turn-enter');
            
            setTimeout(() => {
                if (pageData.type === 'cover') {
                    spreadContainer.innerHTML = `
                        <div class="col-span-1 md:col-span-2 h-full">
                            ${pageData.content}
                        </div>
                    `;
                } else {
                    spreadContainer.innerHTML = `
                        <div class="col-span-1 h-full">${pageData.left}</div>
                        <div class="col-span-1 h-full hidden md:block">${pageData.right}</div>
                    `;
                }
                
                // Update indicator
                document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
                
                // Update buttons state
                document.getElementById('prev-btn').disabled = currentPage === 0;
                document.getElementById('next-btn').disabled = currentPage === totalPages - 1;

                spreadContainer.classList.remove('page-turn-enter');
                spreadContainer.classList.add('page-turn-enter-active');
            }, 150);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderBook();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderBook();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        // Initial render on load
        window.onload = function() {
            renderBook();
        };
    </script>
</body>
</html>
